name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A push made with GITHUB_TOKEN does not start another push workflow.
  # Publish the latest committed feed after collection finishes instead.
  workflow_run:
    workflows: ["Daily collection"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reporadar-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always build trusted main, never a workflow_run contributor's checkout.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
